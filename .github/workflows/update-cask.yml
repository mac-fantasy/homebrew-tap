name: Update Cask

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test checksum verification
        run: python3 -m unittest discover -s tests

      - name: Verify latest release and update cask
        run: python3 scripts/update-cask.py

      - name: Check cask style
        run: brew style Casks/clipbar.rb

      - name: Commit cask update
        run: |
          if git diff --quiet -- Casks/clipbar.rb; then
            echo 'Cask is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/clipbar.rb
          git commit -m 'clipbar: update to latest stable release'
          gh auth setup-git
          git push origin HEAD:main
