name: Update Casks

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test checksum verification
        run: python3 -m unittest discover -s tests

      - name: Verify latest releases and update casks
        run: python3 scripts/update-casks.py

      - name: Check cask style
        run: brew style Casks/*.rb

      - name: Commit cask updates
        run: |
          if git diff --quiet -- Casks; then
            echo 'Casks are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks
          git commit -m 'Update casks to latest stable releases'
          gh auth setup-git
          git push origin HEAD:main
